<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geography Quiz</title>
    <link rel="stylesheet" href="./css/style.css">
    <script src="./js/script.js" defer></script>
</head>

<body>

  <main class="quiz-container">

    <h1>Geography Quiz</h1>
    <p>Answer the five questions below.</p>

		<form id="quizForm">

			<div class="question">
					<label for="answer1">
							1. What is the capital city of Scotland?
					</label>
					<input type="text" id="answer1">
					<p id="result1" class="result"></p>
			</div>

			<div class="question">
					<label for="answer2">
							2. What is the capital city of France?
					</label>
					<input type="text" id="answer2">
					<p id="result2" class="result"></p>
			</div>

			<div class="question">
					<label for="answer3">
							3. Which country is famous for the pyramids at Giza?
					</label>
					<input type="text" id="answer3">
					<p id="result3" class="result"></p>
			</div>

			<div class="question">
					<label for="answer4">
							4. What is the largest ocean in the world?
					</label>
					<input type="text" id="answer4">
					<p id="result4" class="result"></p>
			</div>

			<div class="question">
					<label for="answer5">
							5. Which continent is Brazil in?
					</label>
					<input type="text" id="answer5">
					<p id="result5" class="result"></p>
			</div>

			<button type="submit">Submit Answers</button>

			<p id="finalScore"></p>
			<p id="finalResult"></p>
			

		</form>

  </main>

</body>
</html>
